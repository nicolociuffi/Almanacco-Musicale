<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almanacco Musicale - Ascolto Quotidiano</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
      --blue: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      background-color: #090d16;
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    h1 { font-size: 1.4rem; color: var(--gold); }
    .author-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .quote-box {
      font-size: 0.8rem;
      font-style: italic;
      color: #cbd5e1;
      max-width: 600px;
      margin: 8px auto 0;
    }
    .tools-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn-tool {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-tool:hover { color: var(--text); border-color: var(--muted); }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-nav {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .date-trigger {
      background: #172554;
      border: 1px solid var(--blue);
      color: #bae6fd;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .modal-title { font-size: 1.1rem; color: var(--gold); font-weight: bold; }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .month-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }
    .btn-m {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-m.active {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      border-color: var(--gold);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .day-btn.has-data {
      color: var(--text);
      font-weight: 600;
      border-color: var(--blue);
      background: #1e293b;
    }
    .day-btn.has-data:hover {
      background: var(--blue);
      color: #000;
    }
    .day-btn.current {
      background: var(--gold) !important;
      color: #000 !important;
      font-weight: bold;
      border-color: var(--gold);
    }
    .day-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .day-tag {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .tracks-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .tracks-grid { grid-template-columns: 1fr 1fr; }
    }
    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 12px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .card-classica .card-header { background: #1e1b4b; color: #a5b4fc; }
    .card-risonanze .card-header { background: #3b0764; color: #f0abfc; }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .track-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 4px; color: #fff; }
    .track-author { font-size: 0.9rem; color: var(--gold); margin-bottom: 12px; }
    .track-desc { font-size: 0.85rem; color: #cbd5e1; flex-grow: 1; }
  </style>
</head>
<body>

  <header>
    <h1>Almanacco Musicale</h1>
    <div class="author-sub">A cura del Prof. Nicolò Ciuffi</div>
    <div class="quote-box">"La musica è come la vita, si può fare in un solo modo: insieme." — Ezio Bosso</div>
    
    <div class="tools-bar">
      <button class="btn-tool" id="btn-random">🎲 Giorno a sorpresa</button>
      <button class="btn-tool" onclick="alert('Funzione Playlist in arrivo')">⭐ La mia playlist</button>
      <button class="btn-tool" onclick="alert('Funzione Archivio in arrivo')">🔍 Cerca nell\'archivio</button>
    </div>

    <div class="nav-bar">
      <button class="btn-nav" id="btn-prev">◀ Ieri</button>
      <button class="date-trigger" id="btn-calendar">📅 Seleziona Data</button>
      <button class="btn-nav" id="btn-next">Domani ▶</button>
    </div>
  </header>

  <div class="modal-overlay" id="modal-cal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Seleziona una Giornata</span>
        <button class="btn-close" id="btn-close-modal">&times;</button>
      </div>
      <div class="month-selector" id="month-list"></div>
      <div class="calendar-grid" id="days-grid"></div>
    </div>
  </div>

  <main class="container">
    <div class="day-tag" id="current-tag">Caricamento ascolti...</div>
    <div class="tracks-grid">
      <div class="track-card card-classica">
        <div class="card-header">Canone Classico</div>
        <div class="video-wrapper">
          <iframe id="video-classica" src="" allowfullscreen></iframe>
        </div>
        <div class="card-body">
          <div class="track-title" id="title-classica">--</div>
          <div class="track-author" id="author-classica">--</div>
          <div class="track-desc" id="desc-classica">--</div>
        </div>
      </div>
      <div class="track-card card-risonanze">
        <div class="card-header">Altre Risonanze</div>
        <div class="video-wrapper">
          <iframe id="video-risonanze" src="" allowfullscreen></iframe>
        </div>
        <div class="card-body">
          <div class="track-title" id="title-risonanze">--</div>
          <div class="track-author" id="author-risonanze">--</div>
          <div class="track-desc" id="desc-risonanze">--</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/catalogo.js"></script>
<script src="/app.js"></script>
</html>
